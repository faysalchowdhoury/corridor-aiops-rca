name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,figures,torch]"
      - run: ruff check .
      - run: pytest
      - run: corridor-ingest --tampa-limit 10
      - run: corridor-benchmark --seeds 2 --bootstrap-samples 50 --epochs 1
