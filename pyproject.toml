[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corridor-aiops-rca"
version = "0.1.0"
description = "Evidence-limited misbehavior detection for connected-vehicle telemetry using causal trajectory features and sender-cluster evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Faysal A. Chowdhoury"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]
torch = ["torch>=2.3"]
xgboost = ["xgboost>=2.0"]
ml = ["torch>=2.3", "transformers>=4.44,<5", "shap>=0.46"]
dev = ["pytest>=8.2", "ruff>=0.6"]
all = ["matplotlib>=3.8,<4", "torch>=2.3", "transformers>=4.44,<5", "shap>=0.46", "pytest>=8.2", "ruff>=0.6"]

[project.scripts]
corridor-ingest = "corridor_aiops.data.download:main"
corridor-audit = "corridor_aiops.data.audit:main"
corridor-benchmark = "corridor_aiops.evaluation.benchmark:main"
corridor-figures = "corridor_aiops.evaluation.figures:main"
corridor-reproduce = "corridor_aiops.evaluation.reproduce:main"
corridor-sensitivity = "corridor_aiops.evaluation.sensitivity:main"
corridor-heldout = "corridor_aiops.evaluation.heldout:main"
corridor-clean-audit = "corridor_aiops.evaluation.clean_checkout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
